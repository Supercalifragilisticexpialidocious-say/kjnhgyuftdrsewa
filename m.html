<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Admin Panel</title>
    <link rel="stylesheet" href="d.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .messages-container {
            max-width: 1000px;
            margin: 100px auto 50px;
            padding: 2rem;
        }

        .messages-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .messages-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .message-stats {
            display: flex;
            gap: 1rem;
        }

        .stat-box {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.1), rgba(162, 155, 254, 0.1));
            border-radius: 10px;
            min-width: 100px;
        }

        .stat-box h3 {
            color: #6c5ce7;
            margin: 0;
            font-size: 1.5rem;
        }

        .stat-box p {
            color: #666;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn-small {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #e0e0e0;
        }

        .btn-clear {
            background: #e74c3c;
            color: white;
        }

        .btn-clear:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .messages-list {
            display: grid;
            gap: 1.5rem;
        }

        .message-card {
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #6c5ce7;
            transition: all 0.3s ease;
            animation: slideInUp 0.5s ease;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
            gap: 1rem;
        }

        .message-info h3 {
            margin: 0 0 0.5rem 0;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .message-email {
            color: #6c5ce7;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .message-email:hover {
            color: #a29bfe;
        }

        .message-time {
            display: inline-block;
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.1), rgba(162, 155, 254, 0.1));
            color: #6c5ce7;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .message-content {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            line-height: 1.6;
            color: #2c3e50;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-delete {
            padding: 0.5rem 1rem;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-reply {
            padding: 0.5rem 1rem;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-reply:hover {
            background: #a29bfe;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h2 {
            color: #6c5ce7;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #6c5ce7;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #a29bfe;
        }

        .search-box {
            margin-bottom: 2rem;
            background: white;
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search-box input {
            width: 100%;
            padding: 0.875rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        @media (max-width: 768px) {
            .messages-container {
                margin-top: 80px;
                padding: 1rem;
            }

            .messages-header {
                flex-direction: column;
                text-align: center;
                gap: 1.5rem;
            }

            .message-stats {
                justify-content: center;
                flex-wrap: wrap;
            }

            .action-buttons {
                flex-direction: column;
            }

            .message-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="messages-container">
        <a href="profile-demo.html" class="back-link">← Back to Portfolio</a>

        <div class="messages-header">
            <div>
                <h1>📨 Messages</h1>
            </div>
            <div class="action-buttons">
                <a href="profile-demo.html" class="btn-small btn-back">Back</a>
                <button class="btn-small btn-clear" onclick="clearAllMessages()">Clear All</button>
            </div>
        </div>

        <div class="message-stats">
            <div class="stat-box">
                <h3 id="totalMessages">0</h3>
                <p>Total Messages</p>
            </div>
            <div class="stat-box">
                <h3 id="todayMessages">0</h3>
                <p>Today</p>
            </div>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Search messages by name or email...">
        </div>

        <div id="messagesList" class="messages-list">
            <!-- Messages will be loaded here -->
        </div>
    </div>

    <script>
        let allMessages = [];

        // Load and display messages
        function loadMessages() {
            loadFromLocalStorage();
        }

        function loadFromLocalStorage() {
            let messages = [];
            try {
                messages = JSON.parse(localStorage.getItem('portfolio_messages')) || [];
            } catch (error) {
                console.warn('Invalid localStorage messages data, resetting.', error);
                localStorage.removeItem('portfolio_messages');
                messages = [];
            }

            allMessages = messages.map((msg, index) => ({
                id: index,
                ...msg
            }));
            displayMessages(allMessages);
        }

        function displayMessages(messages) {
            const messagesList = document.getElementById('messagesList');
            const totalMessages = document.getElementById('totalMessages');
            const todayMessages = document.getElementById('todayMessages');

            totalMessages.textContent = messages.length;

            // Count today's messages
            const today = new Date().toDateString();
            const todayCount = messages.filter(msg => new Date(msg.timestamp).toDateString() === today).length;
            todayMessages.textContent = todayCount;

            if (messages.length === 0) {
                messagesList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📬</div>
                        <h2>No Messages Yet</h2>
                        <p>When someone sends you a message through the contact form, it will appear here.</p>
                    </div>
                `;
                return;
            }

            // Display messages in reverse order (newest first)
            messagesList.innerHTML = messages.reverse().map((msg, index) => `
                <div class="message-card">
                    <div class="message-header">
                        <div class="message-info">
                            <h3>${escapeHtml(msg.name)}</h3>
                            <a href="mailto:${escapeHtml(msg.email)}" class="message-email">${escapeHtml(msg.email)}</a>
                        </div>
                        <span class="message-time">${formatTime(msg.timestamp)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.message)}</div>
                    <div class="message-actions">
                        <a href="mailto:${escapeHtml(msg.email)}" class="btn-reply">✉️ Reply via Email</a>
                        <button class="btn-delete" onclick="deleteMessage('${msg.id}')">🗑️ Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const filteredMessages = allMessages.filter(msg => {
                return msg.name.toLowerCase().includes(searchTerm) || 
                       msg.email.toLowerCase().includes(searchTerm);
            });
            displayMessages(filteredMessages);
        });

        // Delete a message
        function deleteMessage(messageId) {
            if (confirm('Are you sure you want to delete this message?')) {
                try {
                    const messages = JSON.parse(localStorage.getItem('portfolio_messages')) || [];
                    messages.splice(messageId, 1);
                    localStorage.setItem('portfolio_messages', JSON.stringify(messages));
                    loadMessages();
                } catch (error) {
                    console.error('Error deleting message:', error);
                }
            }
        }

        // Clear all messages
        function clearAllMessages() {
            if (confirm('⚠️ Are you sure you want to delete ALL messages? This cannot be undone.')) {
                try {
                    localStorage.removeItem('portfolio_messages');
                    loadMessages();
                } catch (error) {
                    console.error('Error clearing messages:', error);
                }
            }
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const dateStr = date.toDateString();
            const todayStr = today.toDateString();
            const yesterdayStr = yesterday.toDateString();

            let dateLabel = date.toLocaleDateString();
            
            if (dateStr === todayStr) {
                dateLabel = 'Today';
            } else if (dateStr === yesterdayStr) {
                dateLabel = 'Yesterday';
            }

            const time = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `${dateLabel} at ${time}`;
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load messages on page load
        loadMessages();

        // Refresh messages every 3 seconds
        setInterval(loadMessages, 3000);
    </script>
</body>
</html>
